<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo A3 - CRUD da API</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --borda:#d9dee3; --txt:#1f2933; --suave:#6b7785; --azul:#1d4ed8; --verm:#b91c1c; --verde:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#111827; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header small { color:#9ca3af; }
  main { max-width:1200px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:8px; padding:16px; }
  h2 { margin:0 0 12px; font-size:15px; }
  label { display:block; font-weight:600; margin:10px 0 4px; font-size:13px; }
  label small { font-weight:400; color:var(--suave); }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--borda); border-radius:6px; font:inherit; background:#fff; }
  button { padding:8px 14px; border:1px solid var(--borda); border-radius:6px; background:#fff; font:inherit; cursor:pointer; }
  button.pri { background:var(--azul); border-color:var(--azul); color:#fff; }
  button.perigo { color:var(--verm); border-color:#f1c0c0; }
  button:disabled { opacity:.5; cursor:default; }
  .abas { display:flex; gap:6px; flex-wrap:wrap; }
  .abas button.ativa { background:#e8eefc; border-color:var(--azul); color:var(--azul); font-weight:600; }
  .barra { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tab { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--borda); white-space:nowrap; }
  th { background:#f9fafb; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--suave); }
  td.acoes { display:flex; gap:6px; }
  .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0 16px; }
  .msg { padding:8px 12px; border-radius:6px; margin-bottom:10px; }
  .msg.erro { background:#fdecec; color:var(--verm); } .msg.ok { background:#e7f6ec; color:var(--verde); }
  pre { margin:0; background:#0f172a; color:#e2e8f0; padding:12px; border-radius:6px; overflow:auto; max-height:260px; font-size:12px; }
  .reqlinha b { padding:2px 7px; border-radius:4px; color:#fff; margin-right:6px; font-size:12px; }
  .GET{background:#0e7490}.POST{background:#15803d}.PUT{background:#b45309}.DELETE{background:#b91c1c}
  .oculto { display:none; }
  .rodape { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px; color:var(--suave); }
</style>
</head>
<body>
<header>
  <h1>Gestão de Comandas · Protótipo do CRUD da API (A3)</h1>
  <small id="quem">Não autenticado</small>
</header>
<main>
  <section class="card" id="login">
    <h2>1. Entrar</h2>
    <form id="formLogin" class="grade">
      <div><label>E-mail</label><input id="email" type="email" value="admin@a3.local" required></div>
      <div><label>Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <div style="align-self:end"><button class="pri" type="submit" style="margin-top:10px">Entrar</button></div>
    </form>
    <div id="msgLogin"></div>
  </section>

  <section class="card oculto" id="app">
    <div class="barra">
      <div class="abas" id="abas"></div>
      <button id="sair">Sair</button>
    </div>
    <div id="msg"></div>
    <div class="barra"><h2 id="titulo" style="margin:0"></h2><button class="pri" id="novo">+ Novo registro</button></div>
    <div class="tab" id="lista"></div>
    <div class="rodape"><button id="ant">‹ Anterior</button><span id="pag"></span><button id="prox">Próxima ›</button></div>
  </section>

  <section class="card oculto" id="editor">
    <h2 id="tituloForm"></h2>
    <form id="form"><div class="grade" id="campos"></div>
      <div style="margin-top:14px;display:flex;gap:8px"><button class="pri" type="submit">Salvar</button><button type="button" id="cancelar">Cancelar</button></div>
    </form>
  </section>

  <section class="card oculto" id="logCard">
    <h2>Requisição enviada à API e resposta (para acompanhar o CRUD)</h2>
    <div class="reqlinha" id="reqlinha"></div>
    <pre id="log">Aguardando…</pre>
  </section>
</main>

<script>
(function () {
  'use strict';
  const API = '../api/v1';
  const $ = id => document.getElementById(id);
  const estado = { token: null, docs: {}, rec: null, pagina: 1, meta: null, editando: null, opcoes: {} };

  function esc(v) { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; }
  function aviso(el, tipo, texto) { el.innerHTML = '<div class="msg ' + tipo + '">' + esc(texto) + '</div>'; }

  // Chamada à API com registro na área de log
  async function chamar(metodo, caminho, corpo) {
    const url = API + caminho;
    const opc = { method: metodo, headers: { 'Accept': 'application/json' } };
    if (estado.token) opc.headers['Authorization'] = 'Bearer ' + estado.token;
    if (corpo !== undefined) { opc.headers['Content-Type'] = 'application/json'; opc.body = JSON.stringify(corpo); }
    const r = await fetch(url, opc);
    const texto = await r.text();
    let json = null; try { json = texto ? JSON.parse(texto) : null; } catch (e) {}
    $('logCard').classList.remove('oculto');
    $('reqlinha').innerHTML = '<b class="' + metodo + '">' + metodo + '</b>' + esc(url) + ' → ' + r.status + ' ' + esc(r.statusText);
    $('log').textContent = (corpo !== undefined ? '// corpo enviado\n' + JSON.stringify(corpo, null, 2) + '\n\n' : '') +
      '// resposta\n' + (json ? JSON.stringify(json, null, 2) : '(sem corpo)');
    if (!r.ok) { const e = new Error((json && json.erro) || 'Erro ' + r.status); e.detalhes = json && json.detalhes; throw e; }
    return json;
  }

  function msgErro(e) {
    let t = e.message;
    if (e.detalhes) t += ' — ' + Object.entries(e.detalhes).map(([k, v]) => k + ': ' + v).join('; ');
    aviso($('msg'), 'erro', t);
  }

  // ---------- Login ----------
  $('formLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    try {
      const r = await chamar('POST', '/auth/login', { email: $('email').value, senha: $('senha').value });
      estado.token = r.token;
      $('quem').textContent = r.usuario.nome + ' (' + r.usuario.perfil + ')';
      const raiz = await chamar('GET', '/');
      estado.docs = raiz.recursos;
      $('login').classList.add('oculto'); $('app').classList.remove('oculto');
      montarAbas(); abrir(Object.keys(estado.docs)[1]);
    } catch (e) { aviso($('msgLogin'), 'erro', e.message); }
  });
  $('sair').addEventListener('click', () => location.reload());

  function montarAbas() {
    $('abas').innerHTML = '';
    Object.keys(estado.docs).forEach(n => {
      const b = document.createElement('button'); b.textContent = n; b.dataset.rec = n;
      b.addEventListener('click', () => abrir(n)); $('abas').appendChild(b);
    });
  }

  // ---------- Listagem ----------
  async function abrir(rec, pagina, manterMsg) {
    estado.rec = rec; estado.pagina = pagina || 1; if (!manterMsg) $('msg').innerHTML = ''; fecharForm();
    document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('ativa', b.dataset.rec === rec));
    $('titulo').textContent = rec;
    try {
      const r = await chamar('GET', '/' + rec + '?limite=8&pagina=' + estado.pagina);
      estado.meta = r.meta; desenharTabela(r.dados);
    } catch (e) { msgErro(e); $('lista').innerHTML = ''; }
  }

  function desenharTabela(linhas) {
    if (!linhas.length) { $('lista').innerHTML = '<p>Nenhum registro.</p>'; atualizarPag(); return; }
    const cols = Object.keys(linhas[0]).filter(k => typeof linhas[0][k] !== 'object' || linhas[0][k] === null);
    let h = '<table><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '<th></th></tr></thead><tbody>';
    linhas.forEach(l => {
      h += '<tr>' + cols.map(c => '<td>' + esc(l[c]) + '</td>').join('') +
        '<td class="acoes"><button data-a="ver" data-id="' + l.id + '">Editar</button><button class="perigo" data-a="del" data-id="' + l.id + '">Excluir</button></td></tr>';
    });
    $('lista').innerHTML = h + '</tbody></table>'; atualizarPag();
  }
  function atualizarPag() {
    const m = estado.meta; $('pag').textContent = 'Página ' + m.pagina + ' de ' + Math.max(1, m.paginas) + ' · ' + m.total + ' registros';
    $('ant').disabled = m.pagina <= 1; $('prox').disabled = m.pagina >= m.paginas;
  }
  $('ant').addEventListener('click', () => abrir(estado.rec, estado.pagina - 1));
  $('prox').addEventListener('click', () => abrir(estado.rec, estado.pagina + 1));

  $('lista').addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.a === 'del') {
      if (!confirm('Excluir o registro ' + id + ' de ' + estado.rec + '?')) return;
      try { await chamar('DELETE', '/' + estado.rec + '/' + id); aviso($('msg'), 'ok', 'Registro excluído.'); abrir(estado.rec, estado.pagina, true); }
      catch (e) { msgErro(e); }
    } else {
      try { const r = await chamar('GET', '/' + estado.rec + '/' + id); abrirForm(r.dados); } catch (e) { msgErro(e); }
    }
  });
  $('novo').addEventListener('click', () => abrirForm(null));

  // ---------- Formulário gerado a partir da documentação da API ----------
  async function abrirForm(reg) {
    estado.editando = reg; $('msg').innerHTML = '';
    const campos = estado.docs[estado.rec].campos;
    $('tituloForm').textContent = (reg ? 'Editar ' + estado.rec + ' #' + reg.id : 'Novo registro em ' + estado.rec);
    $('campos').innerHTML = '';
    for (const [nome, c] of Object.entries(campos)) {
      const div = document.createElement('div');
      const obrig = c.obrigatorio || (!reg && c.obrigatorioCriacao);
      div.innerHTML = '<label>' + esc(nome) + (obrig ? ' *' : '') + (c.descricao ? ' <small>' + esc(c.descricao) + '</small>' : '') + '</label>';
      const el = await criarInput(nome, c, reg ? reg[nome] : undefined);
      if (reg && c.somenteCriacao) el.disabled = true;
      div.appendChild(el); $('campos').appendChild(div);
    }
    $('editor').classList.remove('oculto'); $('editor').scrollIntoView({ behavior: 'smooth' });
  }
  async function criarInput(nome, c, valor) {
    let el;
    if (c.tipo === 'enum' || c.tipo === 'bool' || c.tipo === 'fk') {
      el = document.createElement('select'); el.innerHTML = '<option value="">—</option>';
      let ops = [];
      if (c.tipo === 'enum') ops = c.valores.map(v => [v, v]);
      else if (c.tipo === 'bool') ops = [['true', 'Sim'], ['false', 'Não']];
      else {
        try { const r = await chamar('GET', '/' + c.tabela + '?limite=100'); ops = r.dados.map(d => [d.id, '#' + d.id + ' ' + (d.nome || d.cliente_nome || '')]); } catch (e) {}
      }
      ops.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; el.appendChild(o); });
      if (valor !== undefined && valor !== null) el.value = String(valor);
    } else {
      el = document.createElement('input');
      el.type = { int: 'number', decimal: 'number', email: 'email' }[c.tipo] || 'text';
      if (nome === 'senha') el.type = 'password';
      if (c.tipo === 'decimal') el.step = '0.01';
      if (c.tipo === 'datetime') el.placeholder = 'AAAA-MM-DD HH:MM:SS';
      if (valor !== undefined && valor !== null) el.value = valor;
    }
    el.name = nome; el.dataset.tipo = c.tipo; return el;
  }
  function fecharForm() { $('editor').classList.add('oculto'); estado.editando = null; }
  $('cancelar').addEventListener('click', fecharForm);

  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const corpo = {};
    document.querySelectorAll('#campos [name]').forEach(el => {
      if (el.disabled || el.value === '') return;
      const t = el.dataset.tipo; let v = el.value;
      if (t === 'int' || t === 'fk') v = parseInt(v, 10);
      else if (t === 'decimal') v = parseFloat(v);
      else if (t === 'bool') v = (v === 'true');
      corpo[el.name] = v;
    });
    try {
      if (estado.editando) await chamar('PUT', '/' + estado.rec + '/' + estado.editando.id, corpo);
      else await chamar('POST', '/' + estado.rec, corpo);
      aviso($('msg'), 'ok', 'Registro salvo com sucesso.'); fecharForm(); abrir(estado.rec, estado.pagina, true);
    } catch (e) { msgErro(e); }
  });
})();
</script>
</body>
</html>
