$kind: http-request
url: "{{base}}/itens_comanda"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "comanda_id": "{{id_comanda}}",
      "produto_id": 1,
      "quantidade": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('id_item', pm.response.json().dados.id);
    language: text/javascript
order: 3000
