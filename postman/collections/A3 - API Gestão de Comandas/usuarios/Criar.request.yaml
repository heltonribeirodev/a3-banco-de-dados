$kind: http-request
url: "{{base}}/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Usuário Postman",
      "email": "postman@a3.local",
      "senha": "Senha@123",
      "perfil": "atendente"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('id_usuario', pm.response.json().dados.id);
    language: text/javascript
order: 2000
