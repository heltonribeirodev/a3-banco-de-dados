$kind: http-request
url: "{{base}}/comandas/{{id_comanda}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cliente_id": 1,
      "status": "fiado"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
