$kind: http-request
url: "{{base}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@a3.local",
      "senha": "Senha@123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('token', pm.response.json().token);
    language: text/javascript
order: 1000
