$kind: http-request
url: "{{base}}/pagamentos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "comanda_id": "{{id_comanda}}",
      "metodo": "pix",
      "valor": 500
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 5000
