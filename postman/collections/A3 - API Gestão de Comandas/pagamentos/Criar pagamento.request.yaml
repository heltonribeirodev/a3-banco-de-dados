$kind: http-request
url: "{{base}}/pagamentos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "comanda_id": "{{id_comanda}}",
      "metodo": "pix",
      "valor": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('id_pagamento', pm.response.json().dados.id);
    language: text/javascript
order: 4000
